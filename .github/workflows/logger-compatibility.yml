name: Jeedom logger compatibility
on:
  push:
    branches: [jeedom-logger-compatibility]
  pull_request:
    branches: [beta, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logger:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --no-dev --no-plugins --no-scripts --prefer-dist
      - run: composer install --working-dir=tests/fixtures/jeedom --no-interaction --no-dev --no-plugins --no-scripts --prefer-dist
      - run: php -d error_reporting=-1 tests/loggerCompatibilityTest.php
